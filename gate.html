<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Monitor</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        [hidden] { display: none !important; }

        html, body { height: 100%; }
        body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        /* ---------- slim top bar ---------- */
        .bar {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .bar h1 {
            font-size: 22px;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }
        .conn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
        }
        .conn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
        }
        .conn[data-state="live"] .conn-dot { background: #10b981; }
        .conn[data-state="down"] .conn-dot { background: #ef4444; }
        .sound {
            margin-left: auto;
            border: 2px solid #e5e7eb;
            background: white;
            color: #374151;
            padding: 8px 16px;
            border-radius: 12px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .sound:hover { border-color: #667eea; }
        .sound:focus-visible {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        /* ---------- the result card ---------- */
        .live {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(220px, 34%) 1fr;
            gap: 40px;
            align-items: center;
            padding: 40px;
            border-radius: 28px;
            background: white;
            border: 4px solid #e5e7eb;
            transition: background 0.25s, border-color 0.25s, opacity 0.4s;
        }
        .live[data-state="granted"] {
            background: #bbf7d0;
            border-color: #16a34a;
            --glow: rgba(22, 163, 74, 0.55);
        }
        .live[data-state="denied"] {
            background: #fecaca;
            border-color: #dc2626;
            --glow: rgba(220, 38, 38, 0.55);
        }
        /* An old result fades a little so it isn't mistaken for a new one */
        .live.stale { opacity: 0.7; }
        .live.flash { animation: flash 0.6s ease-out 2; }
        @keyframes flash {
            from { box-shadow: 0 0 0 0 var(--glow); }
            to { box-shadow: 0 0 0 24px transparent; }
        }

        .photo-frame {
            aspect-ratio: 3 / 4;
            max-height: 70vh;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.9);
            display: grid;
            place-items: center;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-empty {
            color: #6b7280;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            padding: 12px;
        }

        .live-body { min-width: 0; }
        .live-status {
            font-size: clamp(40px, 7vw, 104px);
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;
            color: #9ca3af;
        }
        .live[data-state="idle"] .live-status {
            font-size: clamp(26px, 3vw, 40px);
            font-weight: 700;
            letter-spacing: 0;
        }
        .live[data-state="granted"] .live-status { color: #14532d; }
        .live[data-state="denied"] .live-status { color: #7f1d1d; }

        .live-name {
            margin: 18px 0 28px;
            font-size: clamp(28px, 3.6vw, 52px);
            font-weight: 700;
            color: #0f172a;
            overflow-wrap: anywhere;
        }
        .facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px 32px;
        }
        .facts dt {
            color: #374151;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .facts dd {
            margin: 6px 0 0;
            font-size: clamp(20px, 2vw, 28px);
            font-weight: 700;
            color: #0f172a;
            overflow-wrap: anywhere;
        }
        #liveTime { white-space: nowrap; }
        .live-reason {
            margin-top: 24px;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.6);
            color: #7f1d1d;
            font-weight: 700;
            font-size: clamp(18px, 1.8vw, 24px);
        }

        /* ---------- start overlay ---------- */
        .start {
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 46, 0.85);
            display: grid;
            place-items: center;
            z-index: 50;
            padding: 16px;
        }
        .start-card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 440px;
            text-align: center;
        }
        .start-card h2 { font-size: 26px; color: #1a1a2e; margin-bottom: 10px; }
        .start-card p { color: #6b7280; line-height: 1.55; margin-bottom: 24px; }

        @media (max-width: 760px) {
            body { padding: 12px; }
            .live {
                grid-template-columns: 1fr;
                padding: 24px;
                gap: 24px;
            }
            .photo-frame { max-width: 220px; }
        }
    </style>
</head>
<body>
    <div class="bar">
        <h1>🚦 Gate Monitor</h1>
        <span class="conn" id="conn" data-state="connecting">
            <span class="conn-dot" aria-hidden="true"></span>
            <span id="connText">Connecting…</span>
        </span>
        <button class="sound" id="soundBtn" type="button" aria-pressed="true">
            🔊 Sound on
        </button>
    </div>

    <section class="live" id="live" data-state="idle" aria-live="assertive">
        <div class="photo-frame">
            <img id="livePhoto" alt="Registered photo" hidden>
            <div class="photo-empty" id="livePhotoEmpty">No photo</div>
        </div>
        <div class="live-body">
            <div class="live-status" id="liveStatus">Waiting for the next check</div>
            <div class="live-name" id="liveName">&nbsp;</div>
            <dl class="facts">
                <div><dt>LAG ID</dt><dd id="liveLag">–</dd></div>
                <div><dt>Method</dt><dd id="liveMethod">–</dd></div>
                <div><dt>Time</dt><dd id="liveTime">–</dd></div>
            </dl>
            <div class="live-reason" id="liveReason" hidden></div>
        </div>
    </section>

    <!-- Browsers only allow sound after a click -->
    <div class="start" id="start">
        <div class="start-card">
            <h2>🚦 Gate Monitor</h2>
            <p>Each check from the access control app appears here,
               with a beep for granted and an alarm for denied.</p>
            <button class="refresh-btn" id="startBtn" type="button"
                    style="margin:0 auto">Start monitoring</button>
        </div>
    </div>

    <script>
    (() => {
        // Same server that serves this page. No login needed.
        const API = '/api';
        const STALE_AFTER_MS = 30000; // fade a result after this long
        const LATE_AFTER_MS = 60000;  // ignore logs that arrive this late
        const METHOD = {
            FACE: 'Face',
            FINGERPRINT: 'Fingerprint',
            QR: 'QR code',
            NFC: 'NFC',
            CARD: 'Card',
        };

        const $ = (id) => document.getElementById(id);

        // ---------------- sound ----------------
        let audio = null;
        let soundOn = true;
        try {
            soundOn = localStorage.getItem('gateSound') !== 'off';
        } catch (e) {}

        function tone(freq, start, len, type = 'sine', vol = 0.25) {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            const t = audio.currentTime + start;
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
            osc.connect(gain).connect(audio.destination);
            osc.start(t);
            osc.stop(t + len + 0.02);
        }

        function beepGranted() {
            if (!audio || !soundOn) return;
            tone(880, 0, 0.14);
            tone(1320, 0.18, 0.22);
        }

        function alarmDenied() {
            if (!audio || !soundOn) return;
            for (let i = 0; i < 4; i++) {
                tone(620, i * 0.4, 0.19, 'square', 0.18);
                tone(940, i * 0.4 + 0.2, 0.19, 'square', 0.18);
            }
        }

        $('startBtn').addEventListener('click', () => {
            try {
                audio = new (window.AudioContext || window.webkitAudioContext)();
                audio.resume();
            } catch (e) {}
            $('start').hidden = true;
        });

        function renderSound() {
            $('soundBtn').textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
            $('soundBtn').setAttribute('aria-pressed', String(soundOn));
        }
        $('soundBtn').addEventListener('click', () => {
            soundOn = !soundOn;
            try {
                localStorage.setItem('gateSound', soundOn ? 'on' : 'off');
            } catch (e) {}
            renderSound();
            if (soundOn) beepGranted();
        });
        renderSound();

        // ---------------- formatting ----------------
        const timeFmt = new Intl.DateTimeFormat(undefined, {
            hour: '2-digit', minute: '2-digit', second: '2-digit',
        });

        function ago(ms) {
            const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
            if (s < 60) return `${s} s ago`;
            const m = Math.round(s / 60);
            if (m < 60) return `${m} min ago`;
            return `${Math.round(m / 60)} h ago`;
        }

        // ---------------- photo ----------------
        function showPhoto(lagId) {
            const img = $('livePhoto');
            const empty = $('livePhotoEmpty');
            img.hidden = true;
            empty.hidden = false;
            const known = lagId && lagId !== 'UNKNOWN';
            empty.textContent = known ? 'Loading photo…' : 'No photo';
            if (!known) return;
            img.onload = () => {
                img.hidden = false;
                empty.hidden = true;
            };
            img.onerror = () => {
                empty.textContent = 'No registered photo';
            };
            img.src = `${API}/access/photo/${encodeURIComponent(lagId)}`;
        }

        // ---------------- the card ----------------
        let last = null;
        let staleTimer = null;

        function show(e, isNew) {
            last = e;
            const live = $('live');
            const ok = e.accessGranted === true;
            live.dataset.state = ok ? 'granted' : 'denied';
            live.classList.remove('stale', 'flash');
            if (isNew) {
                void live.offsetWidth; // restart the animation
                live.classList.add('flash');
            }
            $('liveStatus').textContent = ok ? 'ACCESS GRANTED' : 'ACCESS DENIED';
            $('liveName').textContent =
                e.name && e.name !== 'Unknown' ? e.name : 'Unknown person';
            $('liveLag').textContent = e.lagId || '–';
            $('liveMethod').textContent =
                METHOD[e.accessType] || e.accessType || '–';
            tickTime();
            $('liveReason').hidden = ok || !e.reason;
            $('liveReason').textContent = e.reason ? `Reason: ${e.reason}` : '';
            showPhoto(e.lagId);

            clearTimeout(staleTimer);
            if (isNew) {
                staleTimer = setTimeout(
                    () => live.classList.add('stale'),
                    STALE_AFTER_MS
                );
            } else {
                live.classList.add('stale');
            }
        }

        function tickTime() {
            if (!last) return;
            $('liveTime').textContent =
                `${timeFmt.format(new Date(last.timestamp))} · ${ago(last.timestamp)}`;
        }
        setInterval(tickTime, 1000);

        // On load, show the most recent result (already faded)
        async function showLatest() {
            if (last) return;
            try {
                const res = await fetch(`${API}/access/logs?limit=1&page=1`);
                const body = await res.json();
                const latest = body.logs && body.logs[0];
                if (latest && !last) show(latest, false);
            } catch (e) {}
        }

        // ---------------- live stream ----------------
        function setConn(state, text) {
            $('conn').dataset.state = state;
            $('connText').textContent = text;
        }

        const stream = new EventSource(`${API}/access/stream`);
        stream.onopen = () => setConn('live', 'Live');
        stream.onerror = () => setConn('down', 'Reconnecting…');
        stream.onmessage = (msg) => {
            let data;
            try { data = JSON.parse(msg.data); } catch (e) { return; }
            if (data.type !== 'access-event') return;
            const e = data.event;
            // Logs the app sends late (queued while offline) aren't
            // current, so they don't take over the screen.
            if (Date.now() - e.timestamp > LATE_AFTER_MS) return;
            show(e, true);
            if (e.accessGranted) beepGranted();
            else alarmDenied();
        };

        showLatest();
    })();
    </script>
</body>
</html>
